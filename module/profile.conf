# Match your AVD exactly:
#   pixel9      = Pixel 9 AVD (tokay) — default
#   pixel9a     = Pixel 9a AVD (tegu)
#   pixel7      = Pixel 7 AVD (panther)
#   pixel6a     = Pixel 6a AVD (bluejay)
#   pixel9proxl = Pixel 9 Pro XL (komodo)
profile=pixel9

# boot_apply=0 → props ONLY on Action tap (no crash). Set 1 to apply on boot.
boot_apply=0

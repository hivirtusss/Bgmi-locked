<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtus Fix License</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: linear-gradient(160deg, #0a0a0f 0%, #1a0a12 100%);
      color: #f5f5f5;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #14141c;
      border: 1px solid #3a1520;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(180, 0, 40, 0.15);
    }
    .logo { text-align: center; font-size: 48px; margin-bottom: 8px; }
    h1 { text-align: center; font-size: 18px; color: #ff4d6d; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: #aaa; margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0d0d12;
      color: #fff;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #c1121f, #ff4d6d);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .fail { background: #3a1010; color: #ff6b6b; border: 1px solid #5a2020; display: block; }
    .ok { background: #103a1a; color: #6bff8b; border: 1px solid #205a30; display: block; }
    .info { margin-top: 16px; font-size: 11px; color: #666; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🛡️</div>
    <h1>Virtus Fix License</h1>
    <p class="sub">Premium Root Hide • By @Hivirtus</p>

    <div id="statusBox" class="status fail">❌ Detection Fail — License Required</div>

    <label>Telegram ID (numeric)</label>
    <input id="tgId" type="text" placeholder="e.g. 123456789" />

    <label>OTP Code (from @Hivirtus)</label>
    <input id="otp" type="text" placeholder="6 digit code" maxlength="6" />

    <label>Username (optional)</label>
    <input id="username" type="text" placeholder="@yourname" />

    <button onclick="saveLicense()">🔐 Save & Verify License</button>

    <p class="info">
      1. Get TG ID from @userinfobot<br>
      2. Message @Hivirtus for approval<br>
      3. Enter OTP here → Reboot → Tap Action 🎯
    </p>
  </div>

  <script>
    const MODID = 'virtus_fix_emulator_hide';
    const MODPATH = '/data/adb/modules/' + MODID;

    function ksuExec(cmd) {
      if (typeof ksu !== 'undefined' && ksu.exec) {
        return ksu.exec(cmd);
      }
      if (typeof $exec === 'function') {
        return $exec(cmd);
      }
      return null;
    }

    function saveLicense() {
      const tgId = document.getElementById('tgId').value.trim();
      const otp = document.getElementById('otp').value.trim();
      const username = document.getElementById('username').value.trim();
      const box = document.getElementById('statusBox');

      if (!tgId) {
        box.className = 'status fail';
        box.style.display = 'block';
        box.textContent = '❌ Enter Telegram ID';
        return;
      }

      const conf = `tg_id=${tgId}\notp=${otp}\nusername=${username}\n`;
      const cmd = `mkdir -p ${MODPATH}/state && cat > ${MODPATH}/license.conf << 'EOF'\n${conf}EOF\nrm -f ${MODPATH}/state/license_ok\nsh ${MODPATH}/common/verify_license.sh`;

      try {
        const out = ksuExec(cmd);
        const text = (out && (out.stdout || out)) ? String(out.stdout || out) : '';
        if (text.includes('LICENSED') || text.includes('OK')) {
          box.className = 'status ok';
          box.textContent = '✅ License Verified! Reboot → Tap Action 🎯';
        } else {
          box.className = 'status fail';
          box.textContent = '❌ Invalid / Not Approved — Contact @Hivirtus';
        }
      } catch (e) {
        box.className = 'status fail';
        box.textContent = '❌ Save license.conf manually → reboot';
      }
      box.style.display = 'block';
    }

    // Load existing
    try {
      const r = ksuExec(`cat ${MODPATH}/license.conf 2>/dev/null`);
      const t = r && (r.stdout || r) ? String(r.stdout || r) : '';
      t.split('\n').forEach(line => {
        if (line.startsWith('tg_id=')) document.getElementById('tgId').value = line.split('=')[1];
        if (line.startsWith('otp=')) document.getElementById('otp').value = line.split('=')[1];
        if (line.startsWith('username=')) document.getElementById('username').value = line.split('=')[1];
      });
      const chk = ksuExec(`sh ${MODPATH}/common/verify_license.sh 2>/dev/null`);
      const ct = chk && (chk.stdout || chk) ? String(chk.stdout || chk) : '';
      if (ct.includes('LICENSED')) {
        const box = document.getElementById('statusBox');
        box.className = 'status ok';
        box.textContent = '✅ Licensed — Tap Action 🎯 to Fix';
        box.style.display = 'block';
      }
    } catch (e) {}
  </script>
</body>
</html>
